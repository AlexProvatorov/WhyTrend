[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whytrend"
version = "0.5.0"
description = "Open Source Framework for Explainable Time Series Analysis"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Alexander Provatorov", email = "sasha.provatorov@gmail.com" },
]
keywords = [
    "time-series",
    "anomaly-detection",
    "explainability",
    "llm",
    "changepoint",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.16",
    "mypy>=1.13",
    "pandas-stubs>=2.0",
    "pyarrow>=15.0",
    "pytrends>=4.9",
]
prophet = ["prophet>=1.1"]
ruptures = ["ruptures>=1.1"]
river = ["river>=0.21"]
ranking = ["sentence-transformers>=3.0"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
# Gemini uses core httpx against the Generative Language REST API (no extra package).
gemini = []
deepseek = ["openai>=1.0"]
azure = ["openai>=1.0"]
openrouter = ["openai>=1.0"]
trends = ["pytrends>=4.9"]
parquet = ["pyarrow>=15.0"]
pdf = ["xhtml2pdf>=0.2.16"]
reports = ["whytrend[pdf]"]
all = [
    "whytrend[prophet,ruptures,river,ranking,openai,anthropic,gemini,deepseek,azure,openrouter,trends,parquet,pdf]",
]

[project.scripts]
whytrend = "whytrend.cli:main"

[project.entry-points."whytrend.sources"]
csv = "whytrend.sources:CSVSource"
pandas = "whytrend.sources:PandasSource"
parquet = "whytrend.sources:ParquetSource"
google_trends = "whytrend.sources:GoogleTrends"

[project.entry-points."whytrend.detectors"]
zscore = "whytrend.detectors:ZScoreDetector"
prophet = "whytrend.detectors:ProphetDetector"
ruptures = "whytrend.detectors:RupturesDetector"
river = "whytrend.detectors:RiverDetector"

[project.entry-points."whytrend.collectors"]
hacker_news = "whytrend.collectors:HackerNewsCollector"
wikipedia = "whytrend.collectors:WikipediaCollector"
google_news = "whytrend.collectors:GoogleNewsCollector"
reddit = "whytrend.collectors:RedditCollector"
github_releases = "whytrend.collectors:GitHubReleasesCollector"
stack_overflow = "whytrend.collectors:StackOverflowCollector"
rss = "whytrend.collectors:RSSFeedCollector"

[project.entry-points."whytrend.rankers"]
bm25 = "whytrend.rankers:BM25Ranker"
embedding = "whytrend.rankers:EmbeddingRanker"

[project.entry-points."whytrend.explainers"]
llm = "whytrend.explainers:LLMExplainer"
openai = "whytrend.explainers:OpenAIExplainer"
anthropic = "whytrend.explainers:AnthropicExplainer"
gemini = "whytrend.explainers:GeminiExplainer"
deepseek = "whytrend.explainers:DeepSeekExplainer"
azure_openai = "whytrend.explainers:AzureOpenAIExplainer"
openrouter = "whytrend.explainers:OpenRouterExplainer"
ollama = "whytrend.explainers:OllamaExplainer"
mock = "whytrend.explainers:MockLLMProvider"

[project.entry-points."whytrend.llm"]
mock = "whytrend.llm:MockLLMProvider"
openai = "whytrend.llm:OpenAIProvider"
anthropic = "whytrend.llm:AnthropicProvider"
gemini = "whytrend.llm:GeminiProvider"
deepseek = "whytrend.llm:DeepSeekProvider"
azure = "whytrend.llm:AzureOpenAIProvider"
openrouter = "whytrend.llm:OpenRouterProvider"
ollama = "whytrend.llm:OllamaProvider"

[project.urls]
Homepage = "https://github.com/AlexProvatorov/WhyTrend"
Documentation = "https://github.com/AlexProvatorov/WhyTrend#readme"
Repository = "https://github.com/AlexProvatorov/WhyTrend"
Issues = "https://github.com/AlexProvatorov/WhyTrend/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/whytrend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "TRY", "C4"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "pytrends.*",
    "prophet.*",
    "sentence_transformers.*",
    "openai.*",
    "anthropic.*",
    "ruptures.*",
    "river.*",
    "xhtml2pdf.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

