[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whytrend"
version = "0.1.0"
description = "Open Source Framework for Explainable Time Series Analysis"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Alexander Provatorov", email = "sasha.provatorov@gmail.com" },
]
keywords = [
    "time-series",
    "anomaly-detection",
    "explainability",
    "llm",
    "changepoint",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]
prophet = ["prophet>=1.1"]
ruptures = ["ruptures>=1.1"]
ranking = ["sentence-transformers>=3.0"]
openai = ["openai>=1.0"]
all = [
    "whytrend[prophet,ruptures,ranking,openai]",
]

[project.urls]
Homepage = "https://github.com/whytrend/whytrend"
Documentation = "https://github.com/whytrend/whytrend#readme"
Repository = "https://github.com/whytrend/whytrend"

[tool.hatch.build.targets.wheel]
packages = ["src/whytrend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
