name: Bug report
description: Report a bug in WhyTrend
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        Security issues: see [SECURITY.md](https://github.com/AlexProvatorov/WhyTrend/blob/main/SECURITY.md) — do not file them here.

  - type: input
    id: version
    attributes:
      label: WhyTrend version
      description: e.g. `0.3.0` or git commit SHA
      placeholder: "0.3.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal snippet or steps
      placeholder: |
        1. ...
        2. ...
        ```python
        from whytrend import Pipeline
        ...
        ```
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: OS, extras installed (`whytrend[river]`), etc.
    validations:
      required: false
